<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Inditrans browser tests</title>
</head>
<body>
  <h1>Inditrans browser tests</h1>
  <div id="test-results" data-status="running"></div>
  <script src="../../js/public/inditrans.js"></script>
  <script>
    window.addEventListener("load", () => {
      const waitForModule = new Promise((resolve, reject) => {
        const deadline = Date.now() + 10000;
        const poll = () => {
          if (Module.inditrans) resolve(Module.inditrans);
          else if (Date.now() >= deadline) reject(new Error("Wasm module initialization timed out"));
          else setTimeout(poll, 10);
        };
        poll();
      });
      waitForModule
        .then((inditrans) => Promise.all([
          fetch("../../test-files/test-cases.json").then((response) => response.json()),
          fetch("../../test-files/urdu-test-lexicon.iul").then((response) => response.arrayBuffer()),
        ]).then(([cases, lexicon]) => ({ inditrans, cases, lexicon: new Uint8Array(lexicon) })))
        .then(({ inditrans, cases, lexicon }) => {
          const results = document.getElementById("test-results");
          let count = 0;
          let failures = 0;
          cases.forEach((testCase) => {
            testCase.targets.forEach((target) => {
              const options = inditrans.optionsToInt(target.options || "");
              const actual = inditrans.transliterate(
                testCase.text, testCase.script, target.script, options);
              // Repeat every call to exercise stable Wasm allocation and release.
              const repeated = inditrans.transliterate(
                testCase.text, testCase.script, target.script, options);
              const passed = actual === target.text && repeated === target.text;
              count += 1;
              if (!passed) failures += 1;
              const row = document.createElement("p");
              row.innerText = `Test ${count}: ${testCase.description} (${testCase.script} -> ${target.script}) ${passed ? "PASSED" : "FAILED"}`;
              row.style.color = passed ? "green" : "red";
              results.appendChild(row);
            });
          });
          const legacy = inditrans.transliterate("کتاب", "urdu", "iast", 0);
          for (const [text, data, options, expected] of [
            ["کتاب", lexicon, 0, "kitāb"],
            ["##کتاب## کتاب", lexicon, 0, "کتاب kitāb"],
            ["کتِاب", lexicon, 0, inditrans.transliterate("کتِاب", "urdu", "iast", 0)],
            ["کتاب", lexicon.subarray(1), 0, legacy],
            ["کتاب", lexicon, 64, inditrans.transliterate("کتاب", "urdu", "iast", 64)],
          ]) {
            const actual = inditrans.transliterateUrduWithLexicon(text, "iast", options, data);
            count += 1;
            if (actual !== expected) {
              failures += 1;
              const row = document.createElement("p");
              row.innerText = `Urdu pronunciation FAILED: expected ${expected}, got ${actual}`;
              results.appendChild(row);
            }
          }
          results.dataset.status = failures === 0 ? "passed" : "failed";
          results.dataset.count = String(count);
          results.dataset.failures = String(failures);
        })
        .catch((error) => {
          const results = document.getElementById("test-results");
          results.dataset.status = "failed";
          results.dataset.error = String(error);
        });
    });
  </script>
</body>
</html>
