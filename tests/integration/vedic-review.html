<!doctype html>
<meta charset="utf-8">
<title>Vedic visual review browser regression</title>
<div id="test-results" data-status="running" data-count="0" data-failures="0"></div>
<iframe src="../../fonts/vedic-review.html"></iframe>
<script>
(async () => {
  const result = document.querySelector('#test-results');
  let count = 0;
  function check(condition, message) { if (!condition) throw new Error(message); count++; }
  try {
    const frame = document.querySelector('iframe');
    await new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
    const win = frame.contentWindow, doc = frame.contentDocument;
    const $ = id => doc.getElementById(id);
    for (let i = 0; i < 100 && $('export').disabled; i++) await new Promise(resolve => setTimeout(resolve, 30));
    check(!$('export').disabled, $('font-status').textContent);
    for (let i = 0; i < 100 && !/ · /.test($('font-status').textContent); i++) await new Promise(resolve => setTimeout(resolve, 30));
    check(doc.querySelectorAll('.card').length > 0, 'Samples rendered');
    $('script').value = 'telugu'; $('script').dispatchEvent(new Event('change'));
    const card = doc.querySelector('.card');
    check(card.textContent.length > 0 && card.children.length === 0, 'Compact text-only sample');
    check(win.getComputedStyle(doc.querySelector('header')).position === 'sticky', 'Controls pinned');
    $('open-about').click(); check($('about-modal').open, 'About modal opens');
    $('about-modal').querySelector('[data-close]').click();
    card.click();
    check($('review-modal').open && doc.querySelectorAll('[data-review]').length === 8, 'Independent axis choices including unsure');
    doc.querySelector('[data-review=collision]').click();
    $('review-modal').close();
    check(doc.querySelector('.card').dataset.status === 'collision', 'Collision highlighted');
    check($('count').textContent.includes('problems saved'), 'Review count updated');
    let exported;
    win.URL.createObjectURL = blob => { exported = blob; return 'blob:review-test'; };
    win.HTMLAnchorElement.prototype.click = function() {};
    $('export').click();
    const data = JSON.parse(await exported.text());
    const record = data.reviews.find(r => r.script === 'telugu' && r.vertical === 'collision');
    check(record && record.codepoints.includes('U+0952'), 'Export retains exact accent');
    check(data.font.sha256?.length === 64 && record.fontSHA256 === data.font.sha256, 'Font fingerprint recorded');
    $('open-editor').click();
    check($('editor').value === record.text && $('editor-modal').open, 'Native editable preview modal');
    $('editor-modal').querySelector('[data-close]').click();
    doc.querySelectorAll('.card')[1].click();
    doc.querySelector('[data-review=gap]').click();
    $('review-modal').close();
    doc.querySelectorAll('.card')[2].click();
    doc.querySelector('[data-review=good]').click();
    $('review-modal').close();
    check(win.getComputedStyle(doc.querySelectorAll('.card')[2]).backgroundColor === 'rgb(255, 255, 255)', 'Okay is white');
    check([...doc.querySelectorAll('.card')].slice(0, 3).every(c => win.getComputedStyle(c).backgroundColor === 'rgb(255, 255, 255)'), 'Problem cells stay white');
    check(win.getComputedStyle(doc.querySelectorAll('.card')[0], '::before').backgroundColor !== win.getComputedStyle(doc.querySelectorAll('.card')[1], '::before').backgroundColor, 'Vertical problem markers have distinct colors');
    check(win.getComputedStyle(doc.querySelectorAll('.card')[0], '::before').content.includes('−') && win.getComputedStyle(doc.querySelectorAll('.card')[1], '::before').content.includes('+'), 'Vertical problem markers have distinct symbols');
    check(win.getComputedStyle(doc.querySelectorAll('.card')[2], '::before').content === 'none', 'Okay has no vertical marker');
    $('export').click();
    const decisions = JSON.parse(await exported.text()).reviews.map(r => r.vertical);
    check(['collision', 'gap', 'good'].every(s => decisions.includes(s)) && decisions.length === 3, 'Existing vertical ratings retained independently');
    const first = doc.querySelector('.card');
    first.click();
    doc.querySelector('[data-axis=horizontal][data-review=left]').click();
    check($('review-modal').open, 'Dialog stays open to rate both axes');
    check(first.dataset.status === 'collision' && first.dataset.horizontal === 'left', 'Vertical and horizontal problems coexist');
    check(win.getComputedStyle(first, '::after').content.includes('←'), 'Horizontal direction indicator');
    $('review-note').value = 'Check right-side vowel sign';
    $('review-note').dispatchEvent(new Event('input'));
    key($('review-note'), '6');
    check(first.dataset.horizontal === 'left', 'Typing in note does not change horizontal rating');
    $('review-modal').querySelectorAll('[data-close]')[1].click();
    first.focus();
    key(first, '5'); check(first.dataset.horizontal === 'good' && first.dataset.status === 'collision', '5 changes horizontal only');
    key(first, '6'); check(first.dataset.horizontal === 'right', '6 marks too far right');
    key(first, '4'); check(first.dataset.horizontal === 'left', '4 marks too far left');
    first.click();
    doc.querySelector('[data-axis=horizontal][data-review=unsure]').click();
    check(first.dataset.horizontal === 'unsure' && first.dataset.complete === 'false', 'Unsure is incomplete');
    check(win.getComputedStyle(first, '::after').content.includes('?') && win.getComputedStyle(first).backgroundColor === 'rgb(255, 255, 255)', 'Unsure marker preserves white background');
    $('review-modal').close();
    $('export').click();
    const axesData = JSON.parse(await exported.text());
    const axesRecord = axesData.reviews.find(r => r.id === first.dataset.id);
    check(axesData.schemaVersion === 2 && axesRecord.vertical === 'collision' && axesRecord.horizontal === 'unsure' && axesRecord.note === 'Check right-side vowel sign', 'Independent ratings and note exported');
    check(axesData.reviews[1].horizontal === null, 'Unreviewed horizontal axis is explicit null');
    // Horizontal-only issues must appear in the problems filter.
    const horizontalOnly = doc.querySelectorAll('.card')[3]; horizontalOnly.focus(); key(horizontalOnly, '6');
    const horizontalId = horizontalOnly.dataset.id;
    $('filter').value = 'problems'; $('filter').dispatchEvent(new Event('change'));
    check([...doc.querySelectorAll('.card')].some(c => c.dataset.id === horizontalId), 'Horizontal-only issue included in problems');
    $('filter').value = 'all'; $('filter').dispatchEvent(new Event('change'));
    doc.querySelector('.card').click(); key($('review-modal'), 'e');
    await new Promise(resolve => setTimeout(resolve, 30));
    check($('editor-modal').open && doc.activeElement === $('editor'), 'E from review dialog keeps focus in editor');
    $('editor-modal').close();
    $('open-custom').click();
    check($('custom-modal').open, 'Custom modal opens');
    $('custom').value = 'క్త్ర॒'; $('add').click();
    check($('group').value === 'custom', 'Custom corpus selected');
    check(doc.querySelector('.card').textContent === 'క్త్ర॒', 'Exact custom accent position retained');
    check(doc.querySelectorAll('.card').length === 1, 'Accented custom line is not given extra accents');
    $('group').value = 'conjunctSigns'; $('group').dispatchEvent(new Event('change'));
    check(doc.querySelectorAll('.card').length === Number($('sample-count').textContent.match(/^(\d+)/)[1]) && doc.querySelectorAll('.card').length > 60, 'Full selected corpus rendered');
    check(!$('prev') && !$('next'), 'No pagination controls');
    function key(target, value) { target.dispatchEvent(new win.KeyboardEvent('keydown', { key: value, bubbles: true, cancelable: true })); }
    let focused = doc.querySelector('.card'); focused.focus();
    key(focused, 'ArrowRight');
    check(doc.activeElement === doc.querySelectorAll('.card')[1], 'Right arrow moves focus');
    key(doc.activeElement, '1');
    check(doc.activeElement.dataset.status === 'collision', '1 marks too close');
    key(doc.activeElement, '2');
    check(doc.activeElement.dataset.status === 'good', '2 marks okay');
    key(doc.activeElement, '3');
    check(doc.activeElement.dataset.status === 'gap', '3 marks too far');
    doc.querySelectorAll('.card')[59].focus(); key(doc.activeElement, 'ArrowRight');
    check(doc.activeElement === doc.querySelectorAll('.card')[60], 'Arrows move beyond former page boundary');
    key(doc.activeElement, 'End');
    check(doc.activeElement === [...doc.querySelectorAll('.card')].at(-1), 'End reaches last sample');
    key(doc.activeElement, 'Home');
    check(doc.activeElement === doc.querySelector('.card'), 'Home reaches first sample');
    key(doc.activeElement, 'e');
    check($('editor-modal').open && $('editor').value === doc.activeElement.value, 'E opens focused sample for editing');
    $('editor').value = 'క్త్రి॒';
    key($('editor'), '2');
    check($('editor-modal').open && $('editor').value === 'క్త్రి॒', 'Rating shortcuts do not intercept editing');
    $('save-edit').click();
    check($('group').value === 'custom' && [...doc.querySelectorAll('.card')].some(c => c.textContent === 'క్త్రి॒'), 'Edit saved as custom case');
    $('group').value = 'signs'; $('group').dispatchEvent(new Event('change'));
    const rows = [...doc.querySelectorAll('.pattern-row')];
    check(rows.length > 3 && rows[0].querySelectorAll('.card').length === rows[3].querySelectorAll('.card').length, 'Bare and vowel-sign rows align');
    const bare = rows[0].querySelector('.card'), withSign = rows[3].querySelector('.card');
    check(bare.dataset.column === withSign.dataset.column && withSign.textContent.startsWith(bare.textContent.slice(0, -1)), 'Same consonant column across signs');
    bare.focus(); key(bare, 'ArrowDown');
    check(doc.activeElement.dataset.column === bare.dataset.column && Number(doc.activeElement.dataset.row) > Number(bare.dataset.row), 'Down arrow keeps character column');
    const target = rows[3].querySelectorAll('.card')[2];
    bare.focus(); target.dispatchEvent(new win.MouseEvent('click', { bubbles: true, shiftKey: true }));
    check(doc.querySelectorAll('.card[data-selected=true]').length === 12 && !$('review-modal').open, 'Shift click selects rectangle without dialog');
    target.focus(); key(target, '1');
    // Direct focus resets selection; extend it again for the bulk operation.
    bare.focus(); target.dispatchEvent(new win.MouseEvent('click', { bubbles: true, shiftKey: true }));
    key(doc.activeElement, '3');
    check([...doc.querySelectorAll('.card[data-selected=true]')].every(c => c.dataset.status === 'gap'), 'Keyboard rating applies to entire rectangle');
    key(doc.activeElement, '6');
    check([...doc.querySelectorAll('.card[data-selected=true]')].every(c => c.dataset.status === 'gap' && c.dataset.horizontal === 'right'), 'Batch horizontal rating preserves vertical');
    const toggled = rows[0].querySelectorAll('.card')[1];
    toggled.dispatchEvent(new win.MouseEvent('click', { bubbles: true, ctrlKey: true }));
    check(toggled.dataset.selected === 'false' && doc.querySelectorAll('.card[data-selected=true]').length === 11, 'Ctrl click toggles one selected cell');
    bare.focus(); key(bare, 'ArrowRight');
    doc.activeElement.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'ArrowRight', shiftKey: true, bubbles: true, cancelable: true }));
    check(doc.querySelectorAll('.card[data-selected=true]').length === 2, 'Shift arrow extends selection');
    rows[3].querySelector('.row-heading').click();
    check(doc.querySelectorAll('.card[data-selected=true]').length === rows[3].querySelectorAll('.card').length, 'Row heading selects whole row');
    key(doc.activeElement, '2');
    check([...rows[3].querySelectorAll('.card')].every(c => c.dataset.status === 'good'), 'Whole row rated from keyboard');
    doc.activeElement.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'a', ctrlKey: true, bubbles: true, cancelable: true }));
    check(doc.querySelectorAll('.card[data-selected=true]').length === doc.querySelectorAll('.card').length, 'Ctrl+A covers filtered corpus');
    key(doc.activeElement, 'Escape');
    check(doc.querySelectorAll('.card[data-selected=true]').length === 0, 'Escape clears selection');
    $('group').value = 'all'; $('group').dispatchEvent(new Event('change'));
    check(Number($('sample-count').textContent.match(/^(\d+)/)[1]) > 60, 'All combinations available');
    $('size').value = '52'; $('size').dispatchEvent(new Event('input'));
    $('accent').value = '॒'; $('accent').dispatchEvent(new Event('change'));
    doc.querySelectorAll('.card')[63].focus();
    doc.activeElement.dispatchEvent(new win.KeyboardEvent('keydown', { key: 'ArrowRight', shiftKey: true, bubbles: true, cancelable: true }));
    const selectedCount = doc.querySelectorAll('.card[data-selected=true]').length;
    const selectedId = doc.activeElement.dataset.id;
    const legacyState = JSON.parse(win.localStorage.getItem('inditrans-vedic-review-v1'));
    const legacyReview = legacyState.reviews[record.id];
    legacyReview.status = legacyReview.vertical;
    delete legacyReview.vertical; delete legacyReview.horizontal;
    win.localStorage.setItem('inditrans-vedic-review-v1', JSON.stringify(legacyState));
    frame.src = '../../fonts/vedic-review.html';
    await new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
    const restored = JSON.parse(frame.contentWindow.localStorage.getItem('inditrans-vedic-review-v1'));
    check(restored.reviews[record.id].horizontal === null, 'Legacy vertical-only review migrated without assuming horizontal okay');
    check(Object.values(restored.reviews).some(r => r.text === record.text && r.vertical === 'collision'), 'Review persisted');
    check(frame.contentDocument.getElementById('group').value === 'all' && frame.contentDocument.getElementById('script').value === 'telugu', 'Script and combination selection restored');
    check(frame.contentDocument.getElementById('size').value === '52' && frame.contentDocument.getElementById('accent').value === '॒', 'Font size and accent restored');
    check(frame.contentDocument.querySelector('[data-active=true]').dataset.id === selectedId, 'Selected sample restored');
    check(frame.contentDocument.querySelectorAll('.card[data-selected=true]').length === selectedCount, 'Multi-cell selection restored');
    // Font rendering succeeds even when the separate fingerprint request fails.
    const reviewSource = await (await fetch('../../fonts/vedic-review.js')).text();
    const retryWindow = frame.contentWindow;
    const retryDoc = frame.contentDocument;
    retryDoc.fonts.load = async () => [{}];
    retryWindow.fetch = async () => { throw new Error('Fingerprint blocked'); };
    retryWindow.eval(reviewSource);
    for (let i = 0; i < 100 && !retryDoc.getElementById('font-status').textContent.includes('fingerprint unavailable'); i++) await new Promise(resolve => setTimeout(resolve, 30));
    check(retryDoc.getElementById('font-status').textContent.includes('Font ready'), 'Font ready despite failed fingerprint: ' + retryDoc.getElementById('font-status').textContent);
    const retryCard = retryDoc.querySelector('.card');
    check(!retryCard.disabled && !retryDoc.getElementById('export').disabled, 'Failed fingerprint does not disable review or export');
    retryCard.click();
    check(retryDoc.getElementById('review-modal').open, 'Character click opens choices after fingerprint failure');
    retryDoc.querySelector('[data-review=gap]').click();
    check(retryDoc.querySelector('.card').dataset.status === 'gap', 'Review recorded after fingerprint failure');
    result.dataset.status = 'passed'; result.dataset.count = count;
  } catch (error) {
    result.dataset.status = 'failed'; result.dataset.count = count;
    result.dataset.failures = '1'; result.textContent = error.stack;
  }
})();
</script>
