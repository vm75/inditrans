name: CI

on:
  push:
    branches: [main, dev, 'experiment/**']
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Release & Version Validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate versions, manifests, and changelog
        run: python3 tool/verify_release.py

      - name: Verify generated artifacts are up to date
        run: |
          python3 tool/generate_headers.py
          python3 tool/generate_bindings.py
          git diff --exit-code -- \
            native/src/script_data.h \
            native/src/exports.h \
            flutter/lib/src/script.dart \
            flutter/lib/src/option.dart \
            flutter/lib/src/bindings.dart \
            nodejs/src/Script.ts \
            nodejs/src/Option.ts \
            js/src/inditrans.post.js

  native:
    name: Native C++ Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake build-essential

      - name: Run C++ test suite
        run: make test

  sanitizers:
    name: Native Sanitizers & Leak Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang build-essential

      - name: Build sanitizer test binary
        run: |
          mkdir -p out
          clang++ \
            -std=c++23 \
            -DBOOST_UT_DISABLE_MODULE \
            -O1 -g \
            -fno-omit-frame-pointer \
            -fno-sanitize-recover=all \
            -fsanitize=address,undefined \
            -I native/src \
            native/src/*.cpp native/tests/*.cpp \
            -o out/inditrans_sanitize_test

      - name: Run AddressSanitizer, LeakSanitizer, and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          LSAN_OPTIONS: exitcode=23
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./out/inditrans_sanitize_test

  performance:
    name: Performance Regression Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository with base history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install benchmark dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang build-essential util-linux

      - name: Select one runner CPU
        run: |
          CPU=$(python3 - <<'PY'
          import os
          print(min(os.sched_getaffinity(0)))
          PY
          )
          echo "BENCH_CPU=$CPU" >> "$GITHUB_ENV"
          echo "Benchmark CPU: $CPU"

      - name: Prepare selected engine baseline with current benchmark harness
        env:
          BASE_SHA: dfe5488dd1a38d22373d4efb2d1517d5252ebf65
        run: |
          BASELINE_DIR="$RUNNER_TEMP/inditrans-baseline"
          git worktree add --detach "$BASELINE_DIR" "$BASE_SHA"
          rm -rf "$BASELINE_DIR/native/bench"
          cp -a native/bench "$BASELINE_DIR/native/bench"
          cp native/src/static_script_types.h "$BASELINE_DIR/native/src/static_script_types.h"
          cp native/src/static_trie.h "$BASELINE_DIR/native/src/static_trie.h"
          test -f "$BASELINE_DIR/native/src/script_data.h"
          mkdir -p "$GITHUB_WORKSPACE/out"
          echo "BASELINE_DIR=$BASELINE_DIR" >> "$GITHUB_ENV"

      - name: Measure selected engine baseline
        run: |
          cd "$BASELINE_DIR"
          taskset -c "$BENCH_CPU" make -f "$GITHUB_WORKSPACE/Makefile" bench-save \
            USE_CHECKED_IN_SCRIPT_DATA=1 \
            BENCH_BASELINE="$GITHUB_WORKSPACE/out/bench-baseline"

      - name: Compare PR timing against selected engine
        run: |
          taskset -c "$BENCH_CPU" make bench-compare \
            BENCH_BASELINE=out/bench-baseline \
            BENCH_REGRESSION_THRESHOLD=10 \
            BENCH_STRICT=1

      - name: Gate allocation and live-byte regressions
        run: |
          awk -F, -v threshold=1 '
            NR==FNR {
              alloc[$1]=$2; bytes[$1]=$3; peak[$1]=$4; live[$1]=$5; count++;
              next
            }
            {
              seen++;
              if (!($1 in alloc)) {
                printf "%s: missing allocation baseline\n", $1;
                bad=1;
                next
              }
              ap=(alloc[$1]==0) ? (($2==0)?0:100) : ($2-alloc[$1])/alloc[$1]*100;
              bp=(bytes[$1]==0) ? (($3==0)?0:100) : ($3-bytes[$1])/bytes[$1]*100;
              pp=(peak[$1]==0) ? (($4==0)?0:100) : ($4-peak[$1])/peak[$1]*100;
              lp=(live[$1]==0) ? (($5==0)?0:100) : ($5-live[$1])/live[$1]*100;
              printf "%-22s alloc=%+.1f%% bytes=%+.1f%% peak=%+.1f%% live=%+.1f%%\n", $1,ap,bp,pp,lp;
              if (ap >= threshold || bp >= threshold || pp >= threshold || lp >= threshold) bad=1;
            }
            END {
              if (seen != count) bad=1;
              exit bad ? 1 : 0
            }
          ' out/bench-baseline-allocs.csv out/bench-current-allocs.csv

      - name: Require complete allocator-probe tracking
        run: |
          check_probe() {
            label="$1"
            dir="$2"
            for mode in devanagari latin virtual-indic expansion protected mixed-protected; do
              raw=$(LD_PRELOAD="$dir/out/libinditrans_alloc_probe.so" \
                "$dir/out/inditrans_alloc_bench" "$mode" 1048576 1 0 2>&1 1>/dev/null)
              echo "$label $mode: $raw"
              untracked=$(printf '%s\n' "$raw" | sed -n 's/.*untracked=\([0-9][0-9]*\).*/\1/p')
              if [ -z "$untracked" ] || [ "$untracked" -ne 0 ]; then
                echo "$label $mode has incomplete allocator tracking (untracked=${untracked:-unknown})"
                return 1
              fi
            done
          }
          check_probe base "$BASELINE_DIR"
          check_probe pr "$GITHUB_WORKSPACE"

  flutter:
    name: Flutter Package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential clang

      - name: Build Linux shared library for FFI
        run: |
          cmake -S native/src -B native/build_linux
          cmake --build native/build_linux

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true

      - name: Record Flutter and Dart versions
        run: flutter --version

      - name: Install Flutter dependencies
        run: cd flutter && flutter pub get

      - name: Install standalone Dart example dependencies
        run: cd flutter/example.dart && dart pub get

      - name: Analyze Flutter package
        run: cd flutter && dart analyze

      - name: Run Flutter tests
        run: cd flutter && LD_LIBRARY_PATH=../native/build_linux flutter test

      - name: Copy root CHANGELOG.md for dry-run
        run: cp CHANGELOG.md flutter/CHANGELOG.md

      - name: Dry-run publish
        run: cd flutter && flutter pub publish --dry-run

  nodejs:
    name: Node.js Package & WASM
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: '6.0.10'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: 'nodejs/yarn.lock'

      - name: Build WASM artifacts
        run: make wasm

      - name: Smoke test standalone Flutter WASM
        run: make test_wasm

      - name: Install dependencies
        run: cd nodejs && yarn install --frozen-lockfile

      - name: Build and test
        run: cd nodejs && yarn test

      - name: Set up Chrome for browser acceptance
        uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: Run shared browser fixture twice per conversion
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: python3 tool/browser_smoke_test.py --browser "$CHROME_PATH"

      - name: Dry-run pack
        run: cd nodejs && npm pack --dry-run

  windows-msvc:
    name: Windows MSVC and Flutter plugin
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure and build C++23 DLL with MSVC
        run: |
          cmake -S native/src -B out/native -A x64 -DCMAKE_BUILD_TYPE=Release
          cmake --build out/native --config Release --parallel

      - name: Verify the Windows DLL C ABI exports
        shell: pwsh
        run: |
          $exports = (dumpbin /nologo /exports out/native/Release/inditrans.dll) -join "`n"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($symbol in @("transliterate", "isScriptSupported", "releaseBuffer")) {
            if ($exports -notmatch "\b$symbol\b") { throw "Missing C ABI export: $symbol" }
          }

      - name: Build and run native C++ tests with MSVC
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $sources = @((Get-ChildItem native/src/*.cpp, native/tests/*.cpp | ForEach-Object { $_.FullName }))
          cl /nologo /std:c++latest /utf-8 /EHsc /DBOOST_UT_DISABLE_MODULE /I native/src $sources /Fe:out/inditrans_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & out/inditrans_test.exe

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true

      - name: Record Flutter and Dart versions
        run: flutter --version

      - name: Build Windows Flutter example
        run: |
          cd flutter/example
          flutter pub get
          flutter build windows --release

      - name: Set up Emscripten for PowerShell release scripts
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: '6.0.10'

      - name: Build standalone and JavaScript Wasm with PowerShell
        shell: pwsh
        run: |
          .\tool\build_wasm.ps1 standalone
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\tool\build_wasm.ps1 js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- flutter/assets/inditrans.wasm js/public/inditrans.js

  apple-flutter:
    name: Apple Clang and Flutter plugin
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Configure, build, and test C++23 engine
        run: |
          cmake -S native/src -B out/native -DCMAKE_BUILD_TYPE=Release
          cmake --build out/native --parallel 2
          clang++ -std=c++23 -DBOOST_UT_DISABLE_MODULE -fno-cxx-modules -O0 -g -I native/src native/src/*.cpp native/tests/*.cpp -o out/inditrans_test
          out/inditrans_test

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true

      - name: Record Flutter and Dart versions
        run: flutter --version

      - name: Build macOS Flutter example
        run: |
          cd flutter/example
          flutter pub get
          flutter build macos --release

      - name: Build iOS Flutter example
        run: |
          cd flutter/example
          flutter build ios --release --no-codesign

  android-flutter:
    name: Android arm64 NDK and Flutter plugin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true

      - name: Record Android SDK toolchain versions
        run: |
          flutter --version
          grep -n 'val ndkVersion' "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt"

      - name: Build Android arm64 Flutter example
        run: |
          cd flutter/example
          flutter pub get
          flutter build apk --release --target-platform android-arm64

  windows-dll:
    name: Windows DLL Cross-Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install x86-64 MinGW-w64 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++-mingw-w64-x86-64 \
            binutils-mingw-w64-x86-64 \
            mingw-w64-x86-64-dev \
            cmake

      - name: Install Wine for main-branch runtime smoke test
        if: github.event_name == 'push'
        run: |
          sudo apt-get install -y wine64

      - name: Build Windows DLL
        run: make dll

      - name: Verify Windows DLL exports and dependencies
        run: ./tool/verify_dll.sh native/build_win/inditrans.dll

      - name: Verify example.dart DLL copy
        run: ./tool/verify_dll.sh flutter/example.dart/inditrans.dll

      - name: Upload Windows DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: inditrans-windows-x86_64-dll
          path: native/build_win/inditrans.dll
          retention-days: 7
