name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/dependabot.yml'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/dependabot.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Release & Version Validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate versions, manifests, and changelog
        run: python3 scripts/verify_release.py

      - name: Verify Unix and PowerShell Wasm release flags match
        run: python3 scripts/verify_wasm_build_parity.py

      - name: Run maintenance script regression tests
        run: make test_scripts

      - name: Verify compiled lexicons and embedded headers are reproducible
        run: make check-lexicons

      - name: Verify generated artifacts are up to date
        run: |
          python3 scripts/generate_headers.py
          python3 scripts/generate_bindings.py
          git diff --exit-code -- \
            native/src/script_data.h \
            native/src/exports.h \
            flutter/lib/src/script.dart \
            flutter/lib/src/option.dart \
            flutter/lib/src/bindings.dart \
            nodejs/src/Script.ts \
            nodejs/src/Option.ts \
            js/src/inditrans.post.js

  indicative-font:
    name: Bundled Indic Font, Vedic Ink & Browser Snapshot
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pinned FontTools and HarfBuzz
        run: python3 -m pip install 'fonttools[woff]==4.67.0' 'uharfbuzz==0.57.0'

      - name: Rebuild pinned font reproducibly
        run: |
          python3 scripts/generate_demo_font.py
          git diff --exit-code -- demo/fonts/inditrans-indic-fallback.woff2 demo/fonts/OFL.txt

      - name: Verify positioned accents and complete shaping
        run: python3 scripts/verify_demo_font.py

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: Capture native-versus-combined font comparison
        run: |
          python3 -m http.server 18775 --bind 127.0.0.1 >/tmp/vedic-font-http.log 2>&1 &
          sleep 1
          mkdir -p out
          "${{ steps.chrome.outputs.chrome-path }}" --headless --no-sandbox \
            --disable-gpu --hide-scrollbars --virtual-time-budget=2000 \
            --window-size=1800,2200 \
            --screenshot=out/vedic-accent-comparison.png \
            http://127.0.0.1:18775/demo/fonts/vedic-accent-comparison.html
          test -s out/vedic-accent-comparison.png

      - name: Upload visual comparison
        uses: actions/upload-artifact@v4
        with:
          name: vedic-accent-browser-comparison
          path: out/vedic-accent-comparison.png
          retention-days: 14

  native:
    name: Native C++ Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run C++ test suite
        run: make test
      - name: Build CLI and test opt-in Urdu pronunciation
        run: |
          make out/inditrans
          python3 tests/integration/urdu_cli_smoke.py

  sanitizers:
    name: Native Sanitizers & Leak Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build sanitizer test binary
        run: |
          mkdir -p out
          clang++ \
            -std=c++23 \
            -DBOOST_UT_DISABLE_MODULE \
            -O1 -g \
            -fno-omit-frame-pointer \
            -fno-sanitize-recover=all \
            -fsanitize=address,undefined \
            -I native/src \
            native/src/*.cpp native/tests/*.cpp \
            -o out/inditrans_sanitize_test

      - name: Run AddressSanitizer, LeakSanitizer, and UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          LSAN_OPTIONS: exitcode=23
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./out/inditrans_sanitize_test

  performance:
    name: Performance Regression Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository with base history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect whether PR changes affect native performance
        id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess

          changed = subprocess.check_output(
              ["git", "diff", "--name-only", os.environ["BASE_SHA"], "HEAD"],
              text=True,
          ).splitlines()
          # Pages and bundled-font tooling cannot affect native transliteration speed.
          # Unknown changes or an empty diff must still run the benchmarks.
          native_neutral = {
              ".github/workflows/pages.yml",
              ".github/workflows/ci.yml",
              "demo/README.md",
              "scripts/stage_pages_demo.py",
              "scripts/tests/test_stage_pages_demo.py",
              "scripts/README.md",
              "scripts/generate_demo_font.py",
              "scripts/measure_vedic_font.py",
              "scripts/verify_demo_font.py",
          }
          run = not changed or any(path not in native_neutral for path in changed)
          print("Changed paths:", *changed, sep="\n  ")
          print("Run native benchmarks:", run)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run={'true' if run else 'false'}\n")
          PY

      - name: Select one runner CPU
        if: steps.impact.outputs.run == 'true'
        run: |
          CPU=$(python3 - <<'PY'
          import os
          print(min(os.sched_getaffinity(0)))
          PY
          )
          echo "BENCH_CPU=$CPU" >> "$GITHUB_ENV"
          echo "Benchmark CPU: $CPU"

      - name: Prepare perf-00-baseline with current benchmark harness
        if: steps.impact.outputs.run == 'true'
        env:
          BASE_REF: perf-00-baseline
        run: |
          git fetch --force origin "refs/tags/$BASE_REF:refs/tags/$BASE_REF"
          BASE_SHA=$(git rev-list -n 1 "$BASE_REF")
          echo "Performance baseline: $BASE_REF ($BASE_SHA)"
          BASELINE_DIR="$RUNNER_TEMP/inditrans-baseline"
          git worktree add --detach "$BASELINE_DIR" "$BASE_SHA"
          rm -rf "$BASELINE_DIR/native/bench"
          cp -a native/bench "$BASELINE_DIR/native/bench"
          test -f "$BASELINE_DIR/native/src/script_data.h"
          mkdir -p "$GITHUB_WORKSPACE/out"
          echo "BASELINE_DIR=$BASELINE_DIR" >> "$GITHUB_ENV"

      - name: Measure perf-00-baseline
        if: steps.impact.outputs.run == 'true'
        run: |
          cd "$BASELINE_DIR"
          taskset -c "$BENCH_CPU" make -f "$GITHUB_WORKSPACE/Makefile" bench-save \
            USE_CHECKED_IN_SCRIPT_DATA=1 \
            BENCH_BASELINE="$GITHUB_WORKSPACE/out/bench-baseline"

      - name: Compare PR timing against perf-00-baseline
        if: steps.impact.outputs.run == 'true'
        run: |
          taskset -c "$BENCH_CPU" make bench-compare \
            BENCH_BASELINE=out/bench-baseline \
            BENCH_REGRESSION_THRESHOLD=10 \
            BENCH_STRICT=1

      - name: Gate allocation and live-byte regressions
        if: steps.impact.outputs.run == 'true'
        run: |
          awk -F, -v threshold=1 '
            NR==FNR {
              alloc[$1]=$2; bytes[$1]=$3; peak[$1]=$4; live[$1]=$5; count++;
              next
            }
            {
              seen++;
              if (!($1 in alloc)) {
                printf "%s: missing allocation baseline\n", $1;
                bad=1;
                next
              }
              ap=(alloc[$1]==0) ? (($2==0)?0:100) : ($2-alloc[$1])/alloc[$1]*100;
              bp=(bytes[$1]==0) ? (($3==0)?0:100) : ($3-bytes[$1])/bytes[$1]*100;
              pp=(peak[$1]==0) ? (($4==0)?0:100) : ($4-peak[$1])/peak[$1]*100;
              lp=(live[$1]==0) ? (($5==0)?0:100) : ($5-live[$1])/live[$1]*100;
              printf "%-22s alloc=%+.1f%% bytes=%+.1f%% peak=%+.1f%% live=%+.1f%%\n", $1,ap,bp,pp,lp;
              if (ap >= threshold || bp >= threshold || pp >= threshold || lp >= threshold) bad=1;
            }
            END {
              if (seen != count) bad=1;
              exit bad ? 1 : 0
            }
          ' out/bench-baseline-allocs.csv out/bench-current-allocs.csv

      - name: Require complete allocator-probe tracking
        if: steps.impact.outputs.run == 'true'
        run: |
          check_probe() {
            label="$1"
            dir="$2"
            for mode in devanagari roman iso-to-tamil expansion protected mixed-protected tamil-to-iso tamil-to-devanagari tamil-superscript-output; do
              raw=$(LD_PRELOAD="$dir/out/libinditrans_alloc_probe.so" \
                "$dir/out/inditrans_alloc_bench" "$mode" 1048576 1 0 2>&1 1>/dev/null)
              echo "$label $mode: $raw"
              untracked=$(printf '%s\n' "$raw" | sed -n 's/.*untracked=\([0-9][0-9]*\).*/\1/p')
              if [ -z "$untracked" ] || [ "$untracked" -ne 0 ]; then
                echo "$label $mode has incomplete allocator tracking (untracked=${untracked:-unknown})"
                return 1
              fi
            done
          }
          check_probe base "$BASELINE_DIR"
          check_probe pr "$GITHUB_WORKSPACE"

  flutter:
    name: Flutter Package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Linux shared library for FFI
        run: |
          cmake -S native/src -B native/build_linux
          cmake --build native/build_linux

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          cache: true

      - name: Record Flutter and Dart versions
        run: flutter --version

      - name: Install Flutter dependencies
        run: cd flutter && flutter pub get

      - name: Install standalone Dart example dependencies
        run: cd flutter/example.dart && dart pub get

      - name: Analyze Flutter package
        run: cd flutter && dart analyze

      - name: Run Flutter tests
        run: cd flutter && LD_LIBRARY_PATH=../native/build_linux flutter test

      - name: Set up Chrome for Dart web FFI
        uses: browser-actions/setup-chrome@v1
        id: dart-web-chrome
        with:
          chrome-version: stable

      - name: Test Urdu lexicon FFI in Dart web
        env:
          CHROME_EXECUTABLE: ${{ steps.dart-web-chrome.outputs.chrome-path }}
        run: python3 tests/integration/dart_web_smoke.py

      - name: Bundle native sources and changelog for pub packaging
        run: python3 scripts/prepare_flutter_package.py

      - name: Build native plugin from isolated package layout
        run: python3 tests/integration/flutter_package_smoke.py

      - name: Dry-run publish
        run: cd flutter && flutter pub publish --dry-run

  nodejs:
    name: Node.js Package & WASM
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: '6.0.10'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependency-path: 'nodejs/yarn.lock'

      - name: Run demo regression tests
        run: make test_demo

      - name: Build WASM artifacts
        run: make wasm

      - name: Verify checked-in WASM artifacts are up to date
        run: |
          git diff --exit-code -- \
            flutter/assets/inditrans.wasm \
            js/public/inditrans.js

      - name: Smoke test standalone Flutter WASM
        run: make test_wasm

      - name: Install dependencies
        run: cd nodejs && yarn install --frozen-lockfile

      - name: Build and test
        run: cd nodejs && yarn test

      - name: Set up Chrome for browser acceptance
        uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable

      - name: Run shared browser fixture twice per conversion
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: python3 tests/integration/browser_smoke.py --browser "$CHROME_PATH"

      - name: Dry-run pack
        run: cd nodejs && npm pack --dry-run

  windows-dll:
    name: Windows DLL Cross-Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install x86-64 MinGW-w64 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++-mingw-w64-x86-64 \
            binutils-mingw-w64-x86-64 \
            mingw-w64-x86-64-dev \
            cmake

      - name: Install Wine for main-branch runtime smoke test
        if: github.event_name == 'push'
        run: |
          sudo apt-get install -y wine64

      - name: Build Windows DLL
        run: make dll

      - name: Verify Windows DLL exports and dependencies
        run: ./scripts/verify_dll.sh native/build_win/inditrans.dll

      - name: Verify example.dart DLL copy
        run: ./scripts/verify_dll.sh flutter/example.dart/inditrans.dll

      - name: Upload Windows DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: inditrans-windows-x86_64-dll
          path: native/build_win/inditrans.dll
          retention-days: 7
