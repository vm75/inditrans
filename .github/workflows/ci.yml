name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Release & Version Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Validate versions, manifests, and changelog
        run: dart tool/verify_release.dart

  native:
    name: Native C++ Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake build-essential

      - name: Run C++ test suite
        run: make test

  flutter:
    name: Flutter Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential clang

      - name: Build Linux shared library for FFI
        run: |
          cmake -S native/src -B native/build_linux
          cmake --build native/build_linux

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: cd flutter && flutter pub get

      - name: Analyze Flutter package
        run: cd flutter && dart analyze

      - name: Run Flutter tests
        run: cd flutter && LD_LIBRARY_PATH=../native/build_linux flutter test

      - name: Copy root CHANGELOG.md for dry-run
        run: cp CHANGELOG.md flutter/CHANGELOG.md

      - name: Dry-run publish
        run: cd flutter && flutter pub publish --dry-run

  nodejs:
    name: Node.js Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: 'nodejs/yarn.lock'

      - name: Install dependencies
        run: cd nodejs && yarn install --frozen-lockfile

      - name: Build and test
        run: cd nodejs && yarn test

      - name: Dry-run pack
        run: cd nodejs && npm pack --dry-run
