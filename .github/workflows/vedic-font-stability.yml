name: Temporary Vedic font reproducibility investigation
on:
  push:
    branches: [fix/vedic-accent-font-metrics]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install 'fonttools[woff]==4.67.0' 'uharfbuzz==0.57.0'
      - name: Probe Python hash seed sensitivity
        run: |
          sha256sum demo/fonts/inditrans-indic-fallback.woff2
          PYTHONHASHSEED=0 python3 scripts/generate_demo_font.py
          cp demo/fonts/inditrans-indic-fallback.woff2 /tmp/seed0a.woff2
          sha256sum /tmp/seed0a.woff2
          PYTHONHASHSEED=0 python3 scripts/generate_demo_font.py
          cp demo/fonts/inditrans-indic-fallback.woff2 /tmp/seed0b.woff2
          sha256sum /tmp/seed0b.woff2
          cmp /tmp/seed0a.woff2 /tmp/seed0b.woff2 || true
          python3 - <<'PY'
          from fontTools.ttLib import TTFont
          import hashlib
          a,b=(TTFont(x) for x in ("/tmp/seed0a.woff2","/tmp/seed0b.woff2"))
          for tag in sorted(set(a.keys())|set(b.keys())):
              if tag=="GlyphOrder":
                  if a.getGlyphOrder()!=b.getGlyphOrder(): print("DIFFERENT GLYPH ORDER")
                  continue
              aa=a.getTableData(tag) if tag in a else b""
              bb=b.getTableData(tag) if tag in b else b""
              if aa != bb:
                  print("NONDETERMINISTIC TABLE",tag,len(aa),len(bb),
                        hashlib.sha256(aa).hexdigest()[:16],hashlib.sha256(bb).hexdigest()[:16])
                  if tag=="head":
                      print("HEAD MODIFIED",a["head"].modified,b["head"].modified)
                      for key in sorted(set(a["head"].__dict__) | set(b["head"].__dict__)):
                          av=a["head"].__dict__.get(key)
                          bv=b["head"].__dict__.get(key)
                          if av!=bv: print("HEAD FIELD DIFF",key,repr(av),repr(bv))
          print("All other tables identical")
          PY
          PYTHONHASHSEED=1 python3 scripts/generate_demo_font.py
          sha256sum demo/fonts/inditrans-indic-fallback.woff2
          cp /tmp/seed0a.woff2 demo/fonts/inditrans-indic-fallback.woff2
      - name: Commit normalized seed-zero WOFF2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add demo/fonts/inditrans-indic-fallback.woff2
          if ! git diff --cached --quiet; then
            git commit -m "Normalize generated WOFF2 to deterministic fontTools hash seed"
            git push
          fi
