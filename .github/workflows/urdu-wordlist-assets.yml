name: Build expanded Urdu wordlist assets (temporary)
# Re-run after correcting deterministic row-order regression assertion.

on:
  push:
    branches: [urdu]
    paths:
      - '.github/workflows/urdu-wordlist-assets.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: urdu
          persist-credentials: true
      - name: Set up pinned Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: '6.0.10'
      - name: Build full candidate wordlist and embedded header
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_urdu_wordlist.py'
          python3 scripts/urdu/build_wordlist.py \
            scripts/urdu/wordlists/wikipron-candidates.tsv \
            scripts/urdu/wordlists/editorial-defaults.tsv \
            --version urdu-wordlist-experimental-2 \
            --provenance 'WikiPron Urdu 2026 candidate plus Inditrans editorial defaults; see scripts/urdu/README.md' \
            --license 'CC BY-SA 4.0 (Wiktionary-derived candidate data)' \
            --out demo/urdu-pronunciation.iul \
            --report scripts/urdu/wordlist-report.json
          python3 scripts/urdu/embed_lexicon.py
          python3 scripts/urdu/embed_lexicon.py --check
      - name: Regenerate and test WASM, native CLI and script-data contracts
        shell: bash
        run: |
          set -euo pipefail
          rm -f flutter/assets/inditrans.wasm js/public/inditrans.js
          make wasm
          make test_demo
          node tests/integration/wasm_smoke.cjs
          python3 -m unittest discover -s scripts/tests -p 'test_urdu*.py'
          make out/inditrans
          python3 tests/integration/urdu_cli_smoke.py
      - name: Commit expanded verified IUL1 corpus and rebuilt binaries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add demo/urdu-pronunciation.iul scripts/urdu/wordlist-report.json \
            native/src/urdu_embedded_pack.h flutter/assets/inditrans.wasm js/public/inditrans.js
          if git diff --cached --quiet; then
            echo 'Generated artifacts already current'
          else
            git commit -m 'Embed expanded Urdu wordlist with deterministic homograph defaults (#70)'
            git push origin HEAD:urdu
          fi
