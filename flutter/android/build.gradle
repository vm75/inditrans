// The Android Gradle Plugin builds the native code with the Android NDK.

group = "org.duckdns.vm75.inditrans"
version = "0.18.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath("com.android.tools.build:gradle:8.11.1")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

android {
    namespace = "org.duckdns.vm75.inditrans"

    // Bumping the plugin compileSdk version requires all clients of this plugin
    // to bump the version in their app.
    compileSdk = 35

    // Pin the current NDK LTS for 16 KiB Android memory-page support.
    // Do not silently inherit an older NDK from the consumer application.
    ndkVersion = "30.0.16248370"

    // Invoke the shared CMake build with the Android Gradle Plugin.
    externalNativeBuild {
        cmake {
            // Develop against the canonical engine; pub.dev ships its own copy.
            path = file("../../native/src/CMakeLists.txt").exists() ? "../../native/src/CMakeLists.txt" : "../src/CMakeLists.txt"
            version = "3.22.1"

            // The Android build invokes the shared engine's CMakeLists.txt,
            // which requires CMake >= 3.20 for C++23 standard support.
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    defaultConfig {
        minSdk = 21
    }
}
